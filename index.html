/* Carnet doux + tracker — V2 */
:root{--bg:#faf8f7;--paper:#ffffff;--ink:#36313b;--muted:#817b87;--accent:#997a9c;--accent-dark:#735675;--soft:#f3ebf3;--line:#ece4ea;--green:#65846e;--green-bg:#ecf5ed;--orange:#ad7e49;--orange-bg:#faf0e4;--red:#ab6771;--red-bg:#fbecf0;--shadow:0 7px 24px rgba(71,49,66,.037)}
body{background:linear-gradient(180deg,#faf6f9 0px,#faf8f7 360px)}
.app{padding-top:26px}
.headline{font-size:30px}.top{padding-bottom:25px}
.card{border-radius:19px}.card.tinted{background:linear-gradient(140deg,#f4e8f0,#f8f0e9);border-color:#efe1e9}
.metric:nth-child(2){background:#fdf9fc}.metric:nth-child(3){background:#fdfbf7}
.navitem{font-size:9px;padding:7px 2px;gap:3px}.navitem svg{width:20px;height:20px}
.bottomnav{padding-left:max(9px,calc((100vw - 570px)/2 + 10px));padding-right:max(9px,calc((100vw - 570px)/2 + 10px))}
.vocab-word{font-size:28px;direction:rtl;unicode-bidi:isolate;font-family:'Noto Naskh Arabic','Traditional Arabic','Amiri',serif;line-height:1.65;color:#553b61;letter-spacing:.25px}
.vocab-meaning{font-weight:700;font-size:14px}.vocab-alpha{position:sticky;top:0;z-index:2;background:#faf8f7f0;backdrop-filter:blur(8px);font-family:'Traditional Arabic',serif;color:var(--accent-dark);font-size:25px;padding:10px 5px 5px;border-bottom:1px solid var(--line)}
.vocab-entry{border-bottom:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:7px 8px;align-items:center}.vocab-entry:last-child{border:0}
.vocab-search{width:100%;border:1px solid var(--line);border-radius:14px;min-height:45px;padding:11px 13px;outline:0;background:white}
.vocab-search:focus{border-color:var(--accent)}
.vocab-quick{display:flex;gap:6px;flex-wrap:wrap}.vocab-quick button{border:1px solid var(--line);border-radius:99px;background:white;color:var(--muted);padding:7px 11px;font-size:12px;font-weight:650}.vocab-quick button.active{background:var(--soft);border-color:#d8bfdb;color:var(--accent-dark)}
.vocab-mini{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700}
.card-blank{background:#fffdfc}
.session-details{margin:9px 0;padding:9px 10px;border-radius:10px;background:#faf6f9;font-size:12px;color:var(--muted)}.session-details summary{cursor:pointer;font-weight:650;color:var(--accent-dark)}.session-details[open] summary{margin-bottom:7px}
.home-journal{border-left:3px solid #caabc4;padding-left:12px;margin-top:8px}
.arabic-input{direction:rtl;text-align:right;font-size:22px!important;font-family:'Noto Naskh Arabic','Traditional Arabic',serif!important}
@media(max-width:355px){.navitem{font-size:8px}.bottomnav{gap:0}.app{padding-left:13px;padding-right:13px}}

/* Navigation latérale discrète — palette et logo originaux conservés */
.app{padding-top:22px;padding-bottom:48px}
.top{gap:12px;align-items:center;padding-bottom:23px}
.top-titles{min-width:0;flex:1}.top .headline{font-size:27px}
.top .sub{display:none}
.menu-trigger{display:grid;place-items:center;flex:0 0 40px;width:40px;height:42px;background:#fff;border:1px solid var(--line);border-radius:13px;color:var(--accent-dark)}
.menu-trigger svg{height:21px;width:21px}
.top-right{flex:0 0 43px}
.drawer-shade{position:fixed;inset:0;background:rgba(37,25,38,.38);z-index:49;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:50;width:min(300px,84vw);background:#fffefa;box-shadow:10px 0 35px rgba(46,30,52,.13);transform:translateX(-106%);visibility:hidden;pointer-events:none;transition:transform .2s;display:flex;flex-direction:column;padding:28px 15px max(18px,env(safe-area-inset-bottom))}
body.drawer-open{overflow:hidden}
body.drawer-open .drawer-shade{opacity:1;visibility:visible;pointer-events:auto}
body.drawer-open .sidebar{transform:translateX(0);visibility:visible;pointer-events:auto}
.drawer-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding:0 6px 17px;border-bottom:1px solid var(--line)}
.drawer-heading .eyebrow{font-size:11px;letter-spacing:1.6px}
.side-links{display:flex;flex-direction:column;gap:4px}
.side-link{display:flex;align-items:center;gap:13px;width:100%;padding:13px 12px;border:0;border-radius:13px;background:transparent;color:var(--ink);font-weight:650;text-align:left;font-size:14px}
.side-link.active{background:var(--soft);color:var(--accent-dark)}
.side-icon{width:25px;flex:0 0 25px;text-align:center;font-size:22px;font-family:Georgia,'Traditional Arabic',serif;color:var(--accent)}
.drawer-bottom{border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
/* Mémos des symboles d'arrêt */
.signs-intro{margin:0 0 13px;font-size:12px;color:var(--muted)}
.signs-list{display:grid;gap:10px}
.signcard{display:flex;align-items:center;gap:14px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:17px;min-height:83px}
.signsymbol{background:#f5edf3;display:grid;place-items:center;min-width:62px;height:60px;border-radius:13px;font-size:27px;font-family:'Traditional Arabic','Amiri',serif;color:#715071;direction:rtl}
.signinfo{flex:1;min-width:0}.signinfo strong{display:block;font-size:14px;margin-bottom:4px}.signinfo small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.signs-source{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}
@media(max-width:380px){.top{gap:9px}.top .headline{font-size:25px}.menu-trigger{flex-basis:37px;width:37px}.top-right{flex-basis:39px;width:39px}}


.week-tracker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:360px;margin:9px auto 5px;padding:3px 4px}
.week-day{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.week-circle{height:25px;width:25px;border-radius:50%;display:grid;place-items:center;background:#f0eaef;color:#9b8a9b;font-size:16px;line-height:1}
.week-circle.complete{background:#eaf3ec;color:var(--green);font-weight:800;border:1px solid #cce2d2}

/* V6 : layout cohérent avec la première interface violette et la taille du téléphone. */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app{width:100%;max-width:570px}
.modal-wrap{padding:8px 8px 0;align-items:flex-end}
.modal{width:100%;max-width:570px;max-height:95dvh;min-width:0;overflow-x:hidden;padding:18px 17px max(25px,env(safe-area-inset-bottom))}
#modalbody,.session-section,.session-repeat{min-width:0;max-width:100%}
#sessionform input,#sessionform select,#sessionform textarea,.field input,.field select,.field textarea,.inlineinput,.vocab-search{font-size:16px!important;max-width:100%}
#sessionform input[type="number"]{min-width:0;appearance:textfield;-moz-appearance:textfield}
#sessionform input[type="number"]::-webkit-inner-spin-button,#sessionform input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#sessionform .session-section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:15px 0}
#sessionform .session-section-title{font-size:15px;font-weight:780;color:var(--accent-dark);margin:0 0 12px}
#sessionform .field{margin:10px 0}
#sessionform .fieldline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
#sessionform .session-repeat{border:1px solid #eee6ed;background:#fdf9fb;padding:10px;border-radius:13px;margin-bottom:10px}
#sessionform .session-repeat:first-child{margin-top:4px}
#sessionform .session-numbers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 33px;gap:8px;align-items:end}
#sessionform .session-meaning{display:grid;grid-template-columns:minmax(0,1fr) 33px;gap:8px;align-items:end}
#sessionform .remove-row{margin-bottom:10px;height:45px;min-width:33px}
#sessionform .field input,#sessionform .field select{height:47px;padding:10px}
#sessionform .field textarea{min-height:73px}
#sessionform .modal-actions{position:sticky;bottom:-25px;background:linear-gradient(transparent,var(--bg) 14%);padding-top:16px;padding-bottom:12px;z-index:2}
#sessionform .modal-actions .btn{min-width:0;padding:11px 8px}
@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.modal{padding:15px 12px max(19px,env(safe-area-inset-bottom))}#sessionform .session-section{padding:11px}#sessionform .session-numbers{gap:5px}}


/* V7 — pages quotidiennes du journal, coloris violet inchangés */
.diary-navigation{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin:6px 0 14px}
.diary-arrow{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:25px;color:var(--accent-dark);line-height:1;display:grid;place-items:center}
.diary-arrow:disabled{opacity:.25}
.diary-date-block{text-align:center;min-width:0}
.diary-date-block .label{font-size:9px}
.diary-date{font-family:Georgia,serif;font-size:17px;color:var(--ink);margin-top:4px;text-transform:capitalize;line-height:1.2}
.diary-datepicker{display:flex;align-items:center;gap:9px;margin-bottom:16px;justify-content:center}
.diary-datepicker label{font-size:12px;color:var(--muted);white-space:nowrap}
.diary-datepicker input{font-size:16px!important;min-width:0;max-width:175px;background:white;border:1px solid var(--line);border-radius:10px;height:42px;padding:8px;color:var(--ink)}
.diary-datepicker .linkbtn{white-space:nowrap}
.diary-page{background:#fffdfd;border:1px solid var(--line);border-radius:19px;padding:18px 16px 17px;box-shadow:var(--shadow);min-height:270px}
.diary-page-title{display:flex;align-items:center;justify-content:space-between;font:22px Georgia,serif;color:var(--accent-dark);padding:0 0 14px;border-bottom:1px solid var(--line)}
.diary-entry{padding:16px 0 15px;border-bottom:1px solid var(--line)}
.diary-entry-head{gap:5px;margin:0 0 12px;flex-wrap:wrap}
.diary-entry-head .tinybtn{padding:7px 4px}
.diary-entry .diary-subhead{font-size:12px;font-weight:800;color:var(--accent-dark);margin:12px 0 4px}
.diary-entry .note-line{font-size:13px;color:#756975;margin:8px 0}
.diary-surahs{display:flex;flex-wrap:wrap;gap:6px}
.diary-surah{background:#f7eff6;border:1px solid #ebdce8;border-radius:9px;padding:6px 8px;font-size:12px}
.diary-attention{background:#fdf2f5;border-left:3px solid #d6a9bb;padding:9px 11px;border-radius:0 9px 9px 0;margin-top:10px;font-size:12px}
.diary-attention .note-line{margin:3px 0 0}
.diary-blank{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;gap:6px;color:var(--muted);font-size:13px}
.diary-blank-decor{font-size:27px;color:#c5abc2}
.diary-add{margin-top:19px}
.diary-count{text-align:center;color:var(--muted);font-size:11px;margin:12px 0}
.settings-section{margin-top:17px}.settings-section h3{font-size:16px;margin:0 0 9px;color:var(--accent-dark)}
.settings-section .card{padding:13px}.settings-section .chart{gap:5px}

.home-intro{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 13px}
.home-intro h2{font:600 23px Georgia,serif;margin:0;color:var(--ink)}
.progress-strip{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:white;border:1px solid var(--line);border-radius:18px;padding:13px 15px 12px;margin-bottom:15px;box-shadow:var(--shadow)}
.progress-strip>div:first-child{border-right:1px solid var(--line)}
.metric-number{display:block;font:600 27px/1.15 Georgia,serif;color:var(--accent-dark)}

.metric-caption{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.progress-strip-line{grid-column:1/-1;height:6px;overflow:hidden;background:#eee6ee;border-radius:20px;margin-top:8px}
.progress-strip-line .fill{height:100%;border-radius:20px}
.daily-primary{font-size:16px;min-height:53px;border-radius:15px;margin:0 0 9px}
.daily-secondary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.daily-secondary .btn{font-size:14px;min-height:48px;padding:10px 5px;gap:6px;white-space:nowrap}
.daily-secondary .btn svg{width:17px;height:17px}
.mini-count{background:var(--soft);border-radius:50px;padding:2px 7px}
.current-surah{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid #eadbea;border-radius:14px;width:100%;text-align:left;min-height:51px;padding:9px 13px;margin-bottom:13px;color:var(--accent-dark)}
.current-surah .current-label{font-size:11px;color:var(--muted)}.current-surah strong{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis}.current-surah>span:last-child{font-size:24px;line-height:1}
.focus-card{padding:13px 15px}.focus-card .compact-title{margin-bottom:3px;font-size:15px}.focus-item{min-height:50px}.focus-name{font-size:14px}.focus-more{margin-top:7px}
.home-goals{padding:13px 15px}.home-goals .compact-title{font-size:15px}.home-goals .task{min-height:45px}.goal-empty{border:0;background:var(--soft);color:var(--accent-dark);width:100%;padding:12px;text-align:left;border-radius:10px;font-weight:650}
.home-week-mini{padding:0 8px 12px}.home-week-mini .week-mini-heading{font-size:13px;color:var(--muted);display:block;margin:2px 0 10px}.home-week-mini .week-tracker{margin:0}.week-circle{width:30px;height:30px}
.quick-top{display:flex;align-items:center;gap:14px;padding:12px;border-radius:13px;background:white;margin-bottom:15px}.quick-top label{font-weight:650;font-size:14px}.quick-top input{min-height:40px;width:157px;max-width:65%;border:1px solid #e6dce5;border-radius:10px;font-size:16px!important;padding:7px 11px;text-align:center;background:white}
.quick-heading{font-weight:760;font-size:18px;color:var(--accent-dark);margin:0 0 12px}.quick-kind{gap:9px;margin-bottom:12px}.quick-kind button{min-height:49px;font-size:15px}.quick-number{margin:7px 0!important}.quick-number label{font-size:13px}.quick-number select{width:100%;min-height:49px;border-radius:12px;background:white;border:1px solid var(--line);font-size:16px!important;padding:9px 10px;color:var(--ink)}
.quick-sub{display:none;color:var(--muted);font-size:12px;margin:2px 1px 19px;overflow-wrap:anywhere}
.quick-issue-heading{display:flex;gap:9px;align-items:center;margin-bottom:12px}.quick-issue-heading strong{font-size:15px}.quick-add{min-height:46px;margin-bottom:13px}
#quickreviewform .optional-field{margin-top:4px}#quickreviewform .optional-field summary{min-height:44px;color:var(--accent-dark);font-size:13px}
.quick-done-hint{text-align:center;color:var(--muted);font-size:12px;padding:12px 0 4px}
.modal-head{background:var(--bg);position:sticky;top:-20px;z-index:2;padding:10px 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.modal-quick{width:44px;height:44px;min-height:44px}.modal-quick-actions{gap:9px}.modal-quick.confirm{background:var(--accent-dark)}
.modal{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.side-links .side-link{font-size:15px;min-height:49px}.side-link.active{font-weight:750}
.surah-list .surah-row{min-height:54px;padding:10px 12px}.surah-overview{padding:12px 15px;margin-bottom:12px}.surah-counter{font-size:23px}.surah-pct{font-size:23px}
.filter-chips{gap:6px}.filter-chip{font-size:12px;min-height:43px;padding:9px 13px}
.diary-detailed{display:block;text-align:center;min-height:44px;width:100%;font-size:13px;padding:12px 0}
input,select,textarea{font-size:16px!important}
@media(max-width:365px){.app{padding-left:12px;padding-right:12px}.daily-secondary .btn{font-size:13px}.home-intro h2{font-size:21px}.metric-number{font-size:25px}.current-surah .current-label{max-width:80px}.focus-card,.home-goals{padding-left:12px;padding-right:12px}}


/* V17 — plusieurs fautes par sourate, chaque verset enregistré indépendamment */
.corr-group{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}
.corr-group-head{display:flex;gap:8px;align-items:end;justify-content:space-between}
.corr-group-head>.field{flex:1;min-width:0;margin:2px 0 10px}
.corr-items{display:flex;flex-direction:column;gap:9px}
.corr-item{padding:10px;background:#faf6f9;border:1px solid #efe2eb;border-radius:12px}
.corr-item-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:5px}
.corr-item-head strong{font-size:12px;color:var(--accent-dark)}
.corr-row{display:grid;grid-template-columns:minmax(68px,88px) minmax(0,1fr);gap:9px;align-items:start}
.corr-row .field{margin:0!important;min-width:0}
.corr-row input,.corr-row textarea{width:100%;min-width:0;min-height:43px;padding:10px 9px;border:1px solid #e5d9e1;border-radius:11px;background:#fff;color:var(--ink)}
.corr-row textarea{height:54px;min-height:54px;resize:vertical}
.corr-row label{font-size:12px;margin:0 0 5px;display:block}
.corr-remove{border:0;background:transparent;color:var(--accent-dark);font-size:12px;padding:7px 3px;min-height:38px;font-weight:650}
.corr-add-verse{margin-top:9px;width:100%;min-height:42px;font-size:13px}
.corr-group-head .corr-remove{margin-bottom:8px;flex:none}
.corr-error-hint{font-size:11px;color:var(--muted);padding-top:5px}

/* V18 — Safari iPhone : pas de zoom automatique sur les champs ou au double tap. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:auto}
button,a,input,select,textarea,[role="button"]{touch-action:manipulation}
@media (pointer:coarse){
 input:not([type="checkbox"]):not([type="radio"]),textarea,select,
 #sessionform input,#sessionform select,#sessionform textarea,
 .inlineinput,.vocab-search,#journal-date{font-size:16px!important}
}


/* V20 — Retour accueil permanent et accessible sur chaque rubrique. */

/* V21 – premier démarrage simple, saisie rapide et suivi des acquis */
.welcome-lead{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.45}
.welcome-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);background:white;border-radius:13px;margin:8px 0;font-size:14px;cursor:pointer;min-height:48px}
.welcome-option input{accent-color:var(--accent);width:19px;height:19px;flex-shrink:0}

.welcome-juz-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;max-height:215px;overflow:auto;padding:8px 2px}

.welcome-surah-list input{width:18px;height:18px;accent-color:var(--accent)}
.welcome-summary{font-weight:700;color:var(--accent-dark);font-size:13px;margin:12px 0}
.welcome-actions{display:grid;gap:8px;margin-top:14px}
.welcome-actions .btn{min-height:48px}
.welcome-search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin-top:8px}
.welcome-guide{font-size:12px;color:var(--muted);margin:8px 0}
.backup-indicator{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--accent-dark)}
.mistake-followup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.mistake-followup button{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 11px;color:var(--accent-dark);font-size:12px;font-weight:700;min-height:39px}
.mistake-followup button:disabled{color:var(--muted);background:#f4f0f3}
.mistake-meta{font-size:11px;color:var(--muted);margin:5px 0}
.quick-last{display:block;width:100%;text-align:left;border:1px dashed #d4b8cb;border-radius:11px;padding:11px 12px;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:700;margin-bottom:10px}
.bulk-entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:12px 14px;border:1px solid var(--line);background:white;border-radius:13px;color:var(--accent-dark);font-weight:700;font-size:13px;margin:12px 0}
@media(max-width:355px){.welcome-juz-grid{grid-template-columns:1fr 1fr}.welcome-option{font-size:13px}}

<script>
'use strict';
const ICONS={"home": "<path d=\"m3 10 9-7 9 7v10h-6v-7H9v7H3z\"/>", "book": "<path d=\"M12 6c-3-3-7-3-10-2v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-7-1-10 2zm0 0v15\"/>", "list": "<path d=\"M8 5h13M8 12h13M8 19h13\"/><circle cx=\"3\" cy=\"5\" r=\".8\"/><circle cx=\"3\" cy=\"12\" r=\".8\"/><circle cx=\"3\" cy=\"19\" r=\".8\"/>", "calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v5m10-5v5M3 10h18\"/>", "refresh": "<path d=\"M20 12a8 8 0 1 1-3-6M20 3v6h-6\"/>", "target": "<circle cx=\"11\" cy=\"13\" r=\"9\"/><circle cx=\"11\" cy=\"13\" r=\"5\"/><path d=\"m11 13 9-9m-2 0h3V1\"/>", "check": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12 3 3 5-6\"/>", "search": "<circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"m16 16 5 5\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2\"/>", "moon": "<path d=\"M21 14a9 9 0 0 1-11-11 9 9 0 1 0 11 11z\"/>", "flower": "<path d=\"M12 12C1 12 2 3 8 6c1-7 8-7 8 0 6-3 7 6-4 6Zm0 0c11 0 10 9 4 6-1 7-8 7-8 0-6 3-7-6 4-6Z\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"#faf5fa\" stroke=\"none\"/>", "menu": "<path d=\"M4 6h16M4 12h16M4 18h16\"/>"};
function ico(n){return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`}
function bottomNav(active){return [['home','home','Accueil'],['session','book','Ma séance'],['surahs','list','Sourates'],['sessions','calendar','Journal']].map(([id,icon,label])=>`<button class="navitem ${active===id?'active':''}" ${id==='session'?'data-action="nav-session"':`data-nav="${id}"`} ${active===id?'aria-current="page"':''}>${ico(icon)}<span>${label}</span></button>`).join('')}

const NAMES=`Al-Fatiha|Al-Baqara|Al Imran|An-Nisa|Al-Maida|Al-Anam|Al-Araf|Al-Anfal|At-Tawba|Yunus|Hud|Yusuf|Ar-Rad|Ibrahim|Al-Hijr|An-Nahl|Al-Isra|Al-Kahf|Maryam|Ta-Ha|Al-Anbiya|Al-Hajj|Al-Muminun|An-Nur|Al-Furqan|Ash-Shuara|An-Naml|Al-Qasas|Al-Ankabut|Ar-Rum|Luqman|As-Sajda|Al-Ahzab|Saba|Fatir|Ya-Sin|As-Saffat|Sad|Az-Zumar|Ghafir|Fussilat|Ash-Shura|Az-Zukhruf|Ad-Dukhan|Al-Jathiya|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Adh-Dhariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqia|Al-Hadid|Al-Mujadila|Al-Hashr|Al-Mumtahana|As-Saff|Al-Jumua|Al-Munafiqun|At-Taghabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqa|Al-Maarij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddaththir|Al-Qiyama|Al-Insan|Al-Mursalat|An-Naba|An-Naziat|Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Inshiqaq|Al-Buruj|At-Tariq|Al-Ala|Al-Ghashiya|Al-Fajr|Al-Balad|Ash-Shams|Al-Layl|Ad-Duha|Ash-Sharh|At-Tin|Al-Alaq|Al-Qadr|Al-Bayyina|Az-Zalzala|Al-Adiyat|Al-Qaria|At-Takathur|Al-Asr|Al-Humaza|Al-Fil|Quraysh|Al-Maun|Al-Kawthar|Al-Kafirun|An-Nasr|Al-Masad|Al-Ikhlas|Al-Falaq|An-Nas`.split('|');
const VERSE_COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6]; // Numérotation Hafs / Koufa, 6236 versets.
const SURAH=NAMES.map((name,i)=>({id:i+1,name,verses:VERSE_COUNTS[i]}));
function verseCount(id){return VERSE_COUNTS[Number(id)-1]||0}
// Listes du journal : ordre du Coran (1 -> 114), sans regroupement par statut.
// En apprentissage : sourates non commencées ou en cours ; en révision et correction :
// uniquement celles déjà connues (maîtrisées, à renforcer, à corriger).
function journalSurahAllowed(id,mode){
 const status=sStatus(id);
 if(mode==='learn')return status==='none'||status==='learning'||Number(db.currentSurah)===Number(id);
 return status==='mastered'||status==='strengthen'||status==='correct';
}
function journalSurahOptions(selected,mode='learn'){
 const chosen=Number(selected)||null;
 // Conserver une ancienne sélection même si son statut a changé après la séance.
 const options=SURAH.filter(s=>journalSurahAllowed(s.id,mode)||s.id===chosen);
 const empty=mode==='learn'?'Choisir une sourate':'Choisir une sourate déjà apprise';
 return `<option value="">${empty}</option>`+options.map(s=>{
  const keep=s.id===chosen&&!journalSurahAllowed(s.id,mode);
  const current=mode==='learn'&&Number(db.currentSurah)===s.id?' (en cours)':'';
  const label=keep?' (ancienne séance)':current;
  return `<option value="${s.id}" ${chosen===s.id?'selected':''}>${s.id}. ${esc(s.name)}${label}</option>`;
 }).join('');
}
function parseDisplayDate(str){
 const m=String(str||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
 if(!m)return null;
 const y=Number(m[3]),mo=Number(m[2]),d=Number(m[1]);const dt=new Date(y,mo-1,d,12);
 if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
 return `${m[3]}-${m[2]}-${m[1]}`;
}
function validateVerseText(input,surah){const max=verseCount(surah);const nums=String(input||'').match(/\d+/g)||[];return nums.every(v=>Number(v)>=1&&Number(v)<=max)}
function setVerseBounds(selector,reset=false){
 const area=typeof selector==='string'?document.querySelector(selector):selector;if(!area)return;
 const su=area.querySelector('[data-verse-surah]');const id=Number(su?.value)||null;
 const max=verseCount(id);
 const from=area.querySelector('[data-verse-from]'),to=area.querySelector('[data-verse-to]');

function convertDin(data){
  if(!data||!data.quranJournal||!data.surahs)throw Error('Sauvegarde Mon Espace Dîn non reconnue');
  const statusMap={acquise:'mastered',revision:'strengthen',apprentissage:'learning',correction:'correct'};
  const statuses={};
  Object.entries(data.surahs).forEach(([n,s])=>{if(statusMap[s])statuses[n]=statusMap[s]});
  const sessions=data.quranJournal.map((j,i)=>{
    const revs=(j.revisions||[]).map(r=>({surah:Number(r.surah),from:r.from||'',to:r.to||''}));
    const learning=Number(j.learnSurah)||null;
    const surah=learning||revs[0]?.surah||null;
    const notes=[j.learnNotes?'Apprentissage : '+j.learnNotes:'',j.reviseNotes?'Révision : '+j.reviseNotes:'',j.attention?'À surveiller : '+j.attention:''].filter(Boolean).join('\n\n');
    return {id:'din-'+(j.id||i),date:j.date,surah,
      type:learning&&revs.length?'mixte':learning?'memorisation':'revision',
      learnSurah:learning,learnFrom:j.learnFrom||'',learnTo:j.learnTo||'',learnNotes:j.learnNotes||'',
      revisions:revs,reviseNotes:j.reviseNotes||'',attention:j.attention||'',vocabIds:[],
      verses:j.learnFrom?(j.learnFrom+(j.learnTo?'–'+j.learnTo:'')):'',
      notes,duration:null,errorVerse:'',errorNote:'',source:'Mon Espace Dîn',createdAt:j.date+'T12:00:00'};
  });
  const vocab=DIN_VOCAB.map((w,i)=>({id:'din-word-'+i,...w,known:false,source:'Anciennes notes'}));
  return {statuses,sessions,mistakes:[],vocab,currentSurah:Number([...data.quranJournal].reverse().find(j=>j.learnSurah)?.learnSurah)||null};
}

// A juz can cross a surah boundary. Count only whole surahs inside the chosen juz;
// partial boundary surahs can be checked individually in the same form.
function fullSurahsInJuz(juz){
 const n=Number(juz),start=HIZB_STARTS[(n-1)*2],next=HIZB_STARTS[n*2]||[115,1];
 if(!Number.isInteger(n)||n<1||n>30||!start)return [];
 const out=[];
 for(const surah of SURAH){
  const startsAfter=surah.id>start[0]||(surah.id===start[0]&&start[1]===1);
  const endsBefore=surah.id<next[0];
  if(startsAfter&&endsBefore)out.push(surah.id);
 }
 return out;
}

// Arabic alphabetic ordering, ignoring vocalisation and the common definite article « al- ».
const ARCOLL=new Intl.Collator('ar',{usage:'sort',sensitivity:'base',numeric:false});
function normAr(t){return String(t||'').normalize('NFKD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').trim()}
function arKey(t){let n=normAr(t);return n.startsWith('ال')&&n.length>3?n.slice(2):n}
function arLetter(t){return arKey(t).charAt(0)||'؟'}
function vocabPage(){
  const known=db.vocab.filter(x=>x.known).length;
  let filtered=db.vocab.filter(w=>(vocabFilter==='all'||(vocabFilter==='known'?!!w.known:!w.known))&&(
    !vocabSearch||[w.arabic,w.meaning,w.note,w.verse,w.surah?ss(w.surah).name:''].some(v=>normAr(v).toLowerCase().includes(normAr(vocabSearch).toLowerCase()))
  )).sort((a,b)=>ARCOLL.compare(arKey(a.arabic),arKey(b.arabic))||ARCOLL.compare(a.arabic,b.arabic));
  let groups={};filtered.forEach(w=>{let letter=arLetter(w.arabic);(groups[letter]??=[]).push(w)});
  return `<div class="card tinted"><span class="label">Mon vocabulaire coranique</span><div class="metricgrid"><div class="metric"><strong>${db.vocab.length}</strong><small>mots enregistrés</small></div><div class="metric"><strong>${known}</strong><small>connus</small></div><div class="metric"><strong>${db.vocab.length-known}</strong><small>à réviser</small></div></div></div>
  <button class="btn full" data-action="new-word">＋ Ajouter un mot arabe</button>
  <div class="section-title">Mon lexique <small>${filtered.length} mot${filtered.length===1?'':'s'}</small></div>
  <input class="vocab-search" id="vocab-search" type="search" aria-label="Rechercher dans le lexique" placeholder="Rechercher un mot en arabe ou en français…" value="${esc(vocabSearch)}">
  <div class="vocab-quick" style="margin:12px 0 18px"><button data-action="vocab-filter" data-id="all" class="${vocabFilter==='all'?'active':''}">Tous</button><button data-action="vocab-filter" data-id="review" class="${vocabFilter==='review'?'active':''}">À réviser</button><button data-action="vocab-filter" data-id="known" class="${vocabFilter==='known'?'active':''}">Connus</button></div>
  ${filtered.length?Object.keys(groups).map(letter=>`<div class="vocab-alpha" dir="rtl">${esc(letter)}</div><div class="card" style="padding:5px 15px">${groups[letter].map(w=>`<div class="vocab-entry"><div><div class="vocab-meaning">${esc(w.meaning)}</div><div class="small muted" style="margin-top:4px">${w.surah?esc(ss(w.surah).name):'Sourate non précisée'}${w.verse?' · v. '+esc(w.verse):''}</div>${w.note?`<p class="note-line">${esc(w.note)}</p>`:''}<div style="margin-top:7px"><span class="pill ${w.known?'green':'orange'}">${w.known?'Connu':'À réviser'}</span></div></div><div class="vocab-word" lang="ar" dir="rtl">${esc(w.arabic)}</div><div style="grid-column:1/-1" class="row between"><button class="linkbtn" data-action="toggle-word" data-id="${esc(w.id)}">${w.known?'Remettre à réviser':'✓ Je connais ce mot'}</button><div><button class="tinybtn" data-action="edit-word" data-id="${esc(w.id)}">Modifier</button><button class="tinybtn" data-action="delete-word" data-id="${esc(w.id)}">Suppr.</button></div></div></div>`).join('')}</div>`).join(''):'<div class="empty">Aucun mot trouvé. Ajoute un mot pour commencer ton lexique.</div>'}
  `;
}

function groupedCorrections(corrections=[]){

function collectCorrections(form){
 const found=[];
 for(const group of form.querySelectorAll('[data-correction-group]')){
  const surah=Number(group.querySelector('[data-corr-surah]').value)||null;
  for(const row of group.querySelectorAll('[data-correction-item]')){
   const verse=row.querySelector('[data-corr-verse]').value.trim();
   const note=row.querySelector('[data-corr-note]').value.trim();
   if(!verse&&!note)continue;
   if(!surah||!note||!validateVerseText(verse,surah)){
    toast('Vérifie la sourate, le verset et la faute');
    row.querySelector(!note?'[data-corr-note]':'[data-corr-verse]').focus();
    return null;
   }
   found.push({id:row.dataset.mistakeId||null,surah,verse,note});
  }
 }
 return found;
}

function importData(file){
 if(!file)return;
 let r=new FileReader();r.onload=()=>{
  try{
    let v=JSON.parse(r.result);
    if(v.quranJournal&&v.surahs){
      if(!confirm('Importer les données Coran de Mon Espace Dîn sans supprimer ton carnet actuel ?'))return;
      let d=convertDin(v), ids=new Set(db.sessions.map(x=>x.id)),mid=new Set(db.mistakes.map(x=>x.id)),wid=new Set(db.vocab.map(x=>x.id));
      d.sessions.forEach(x=>{if(!ids.has(x.id))db.sessions.push(x)});
      d.mistakes.forEach(x=>{if(!mid.has(x.id))db.mistakes.push(x)});
      d.vocab.forEach(x=>{if(!wid.has(x.id))db.vocab.push(x)});
      Object.entries(d.statuses).forEach(([k,x])=>{if(!db.statuses[k])db.statuses[k]=x});
      if(!db.currentSurah)db.currentSurah=d.currentSurah;
      db.dinSeeded=true;db.onboarded=true;save();closeModal();nav('home');toast('Données Coran fusionnées ✓');return;
    }
    if(!Array.isArray(v.sessions)||!Array.isArray(v.goals)||!Array.isArray(v.mistakes)||typeof v.statuses!=='object')throw Error('Format invalide');
    if(!confirm('Remplacer toutes tes données actuelles par celles de ce fichier ?'))return;
    db={sessions:v.sessions,goals:v.goals,mistakes:v.mistakes,statuses:v.statuses||{},statusHistory:v.statusHistory||[],currentSurah:v.currentSurah||null,vocab:v.vocab||[],guided:v.guided||null,dinSeeded:true,onboarded:true,lastBackupAt:v.lastBackupAt||null};
    save();closeModal();nav('home');toast('Sauvegarde restaurée ✓');
  }catch(e){console.error(e);toast('Fichier JSON non reconnu')}
 };r.readAsText(file);
}

 if(a==='guided-start'){const sel=Number(document.querySelector('#guided-surah')?.value);const from=Number(document.querySelector('#guided-from')?.value),to=Number(document.querySelector('#guided-to')?.value);if(!sel||!Number.isInteger(from)||!Number.isInteger(to)||from<1||from>to||to>verseCount(sel)){toast('Vérifie les versets de ton objectif');return}if(!document.querySelector('#guided-read').checked||!document.querySelector('#guided-listen').checked){toast('Lis et écoute la sourate avant de commencer');return}db.currentSurah=sel;if(sStatus(sel)==='none')updateStatus(sel,'learning');setGuided({...newGuided(sel),from,to,verse:from,read:true,listen:true,stage:'verse'});return}
 if(!g)return;
 if(a==='guided-restart'){if(confirm('Revenir au choix du passage ? Les répétitions en cours seront remises à zéro.'))setGuided({...g,stage:'prep',count:0,verse:g.from});return}
 if(a==='guided-error'){g.count=0;if(g.stage==='test'){g.stage='verse';g.verse=g.from}setGuided(g);return}
 if(a==='guided-correct'){
  if(!['verse','link','test'].includes(g.stage))return;
  g.count=(Number(g.count)||0)+1;
  if(g.stage==='verse'&&g.count>=5){g.count=0;if(g.verse>g.from)g.stage='link';else if(g.verse<g.to)g.verse++;else g.stage='test';}
  else if(g.stage==='link'&&g.count>=3){g.count=0;if(g.verse<g.to){g.verse++;g.stage='verse'}else g.stage='test';}
  else if(g.stage==='test'){g.stage='done';g.count=0}
  setGuided(g);return;
 }
 if(a==='guided-finish'&&g.stage==='done'){
  const date=localToday(), recId=uid(),note=document.querySelector('#guided-note')?.value.trim()||g.note||'';
  const notes='Parcours guidé : lecture, écoute, mémorisation et test de mémoire. '+note;
  db.sessions.push({id:recId,date,surah:g.surah,type:'memorisation',learnSurah:g.surah,learnFrom:String(g.from),learnTo:String(g.to),learnNotes:notes,revisions:[],reviseNotes:'',attention:'',verses:g.from+'–'+g.to,notes,duration:null,vocabIds:[],createdAt:new Date().toISOString()});
  const text=`Revoir ${ss(g.surah).name} · v. ${g.from}–${g.to}`;
  for(const offset of [1,3,7]){const d=dayShift(date,offset);if(!db.goals.some(x=>x.date===d&&x.text===text))db.goals.push({id:uid(),date:d,text,done:false});}
  if(document.querySelector('#guided-surah-complete')?.checked&&g.to===verseCount(g.surah)&&['learning','none'].includes(sStatus(g.surah))){updateStatus(g.surah,'strengthen')}
  db.guided=null;save();journalDate=date;nav('sessions');toast('Séance et rappels enregistrés ✓');return;
 }
}
document.addEventListener('change',e=>{if(e.target.id==='guided-surah'){const id=Number(e.target.value);if(id)setGuided(newGuided(id));else{db.guided=null;save();render()}return}if(['guided-read','guided-listen','guided-from','guided-to'].includes(e.target.id))prepChange();});
document.addEventListener('input',e=>{if(e.target.id==='guided-note'&&db.guided){db.guided.note=e.target.value;save();}});

document.addEventListener('change',ev=>{let el=ev.target;
if(el.matches('[data-verse-surah]')){const row=el.closest('[data-verse-row]');setVerseBounds(row,true);const hint=row.querySelector('.verse-hint');if(hint)hint.textContent=verseCount(el.value)?verseCount(el.value)+' versets':'';return}

document.addEventListener('input',ev=>{if(ev.target.id==='s-date'||ev.target.id==='q-date'){
 const i=ev.target;const digits=i.value.replace(/\D/g,'').slice(0,8);i.value=digits.slice(0,2)+(digits.length>2?'/'+digits.slice(2,4):'')+(digits.length>4?'/'+digits.slice(4):'');return;
}if(ev.target.id==='surah-search'){surahSearch=ev.target.value;let start=ev.target.selectionStart;render();let el=document.querySelector('#surah-search');el.focus();el.setSelectionRange(start,start)}else if(ev.target.id==='session-search'){sessionFilter=ev.target.value;let start=ev.target.selectionStart;render();let el=document.querySelector('#session-search');el.focus();el.setSelectionRange(start,start)}else if(ev.target.id==='vocab-search'){vocabSearch=ev.target.value;let start=ev.target.selectionStart;render();let el=document.querySelector('#vocab-search');el.focus();el.setSelectionRange(start,start)}});
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-action],[data-nav]');if(!btn){if(ev.target.id==='modalwrap')closeModal();return}if(btn.dataset.nav){if(document.querySelector('#modalwrap').classList.contains('session-screen')){if(!confirm('Quitter cette séance sans enregistrer ?'))return;closeModal()}nav(btn.dataset.nav);return}let a=btn.dataset.action,id=btn.dataset.id;if(a==='go-home'){scrollMemory.home=0;nav('home');return}if(a?.startsWith('guided-')){guideAction(a,id);return}if(a==='quick-review'){closeMenu();quickReviewModal();return}if(a==='setup-acquis'){closeMenu();showWelcome();return}if(a==='setup-skip'){db.onboarded=true;save();closeModal();return}if(a==='quick-last'){const recent=db.sessions.filter(s=>s.reviewBlocks?.length).sort((x,y)=>String(y.createdAt||y.date).localeCompare(String(x.createdAt||x.date)))[0]?.reviewBlocks?.[0];if(recent){setQuickKind(recent.kind);const el=document.querySelector('#q-number');el.value=String(recent.number);updateQuickLabel();}return}if(a==='surahs-review'||a==='surahs-known'){surahFilter=a==='surahs-review'?'review':'known';nav('surahs');return}if(a==='quick-kind'){setQuickKind(btn.dataset.kind);return}if(a==='open-surah-from-home'){nav('surahs');rememberScroll();selectedSurah=Number(id);render();window.scrollTo({top:0,behavior:'instant'});return}if(a==='nav-session'){closeMenu();if(!document.querySelector('#modalwrap').classList.contains('session-screen')){journalDate=today;sessionModal();}return}if(a==='show-search'){showSurahSearch=!showSurahSearch;if(!showSurahSearch)surahSearch='';render();document.querySelector('#surah-search')?.focus();return}if(a==='filter-surah'){surahFilter=id;render();return}if(a==='home-known'||a==='home-review'){surahFilter=a==='home-known'?'known':'review';nav('surahs');return}if(a==='goals-today'){goalDate=today;render();return}if(a==='home-goal-date'){modal('Date des objectifs',`<form id="goals-date-form"><div class="field"><label for="pick-goal-date">Date</label><input type="date" id="pick-goal-date" required value="${goalDate}"></div></form>`);document.querySelector('#goals-date-form').onsubmit=e=>{e.preventDefault();goalDate=document.querySelector('#pick-goal-date').value;closeModal();render()};return}if(a==='close-modal'){closeModal();return}if(a==='submit-modal'){const form=document.querySelector('#modalbody form');if(form)form.requestSubmit();return}if(a==='settings'){closeMenu();settingsModal();return}if(a==='open-menu'){openMenu();return}if(a==='close-menu'){closeMenu();return}if(a==='add-rev'){document.querySelector('#session-revisions').insertAdjacentHTML('beforeend',sessionRevRow());return}
if(a==='add-correction'){

 const surah=candidates.find(id=>id&&journalSurahAllowed(id,'revise'))||null;
  document.querySelector('#session-corrections').insertAdjacentHTML('beforeend',correctionGroupRow({surah}));return;
 }
 if(a==='add-correction-verse'){
  const group=btn.closest('[data-correction-group]');
  group.querySelector('[data-corr-items]').insertAdjacentHTML('beforeend',correctionVerseRow());
  group.querySelector('[data-correction-item]:last-child [data-corr-verse]')?.focus();return;
 }
 if(a==='remove-correction-verse'){const group=btn.closest('[data-correction-group]');btn.closest('[data-correction-item]')?.remove();if(group&&!group.querySelector('[data-correction-item]'))group.remove();return}
 if(a==='remove-correction-group'){btn.closest('[data-correction-group]')?.remove();return}
 if(a==='add-standalone-verse'){document.querySelector('#standalone-corrections')?.insertAdjacentHTML('beforeend',correctionVerseRow());return}
if(a==='remove-rev'){btn.closest('[data-rev-row]')?.remove();return}
if(a==='add-session-word'){document.querySelector('#session-words').insertAdjacentHTML('beforeend',sessionWordRow());return}
if(a==='remove-session-word'){btn.closest('[data-word-row]')?.remove();return}
if(a==='journal-prev'){journalDate=dayShift(journalDate,-1);render();return}
if(a==='journal-next'){if(journalDate<today)journalDate=dayShift(journalDate,1);render();return}
if(a==='journal-today'){journalDate=today;render();return}
if(a==='toggle-known-surahs'){surahFilter=surahFilter==='known'?'all':'known';render();return}if(a==='new-word'){wordModal(null);return}if(a==='edit-word'){wordModal(id);return}if(a==='vocab-filter'){vocabFilter=id;render();return}if(a==='toggle-word'){let w=db.vocab.find(x=>x.id===id);if(w){w.known=!w.known;save();render();toast(w.known?'Mot marqué comme connu':'Mot remis à réviser')}return}if(a==='delete-word'){if(confirm('Supprimer ce mot du lexique ?')){db.vocab=db.vocab.filter(x=>x.id!==id);save();render()}return}if(a==='change-current'){currentModal();return}if(a==='add-goal'){goalModal();return}if(a==='new-session'){sessionModal(null,id?Number(id):null);return}if(a==='edit-session'){const target=db.sessions.find(x=>x.id===id);if(target?.reviewBlocks?.length)quickReviewModal(id);else sessionModal(id);return}if(a==='new-mistake'){mistakeModal(id);return}if(a==='set-current'){db.currentSurah=Number(id);if(sStatus(id)==='none')updateStatus(id,'learning');save();render();toast('Sourate en cours définie');return}if(a==='set-status'){updateStatus(id,btn.dataset.status);render();toast('Statut mis à jour');return}if(a==='open-surah'){rememberScroll();selectedSurah=Number(id);render();window.scrollTo({top:0,behavior:'instant'});return}if(a==='back-surah'){rememberScroll();selectedSurah=null;render();restoreScroll('surahs');return}if(a==='choose-tip'){tipSelected=id;render();return}if(a==='export'){exportData();return}if(a==='delete-goal'){if(confirm('Supprimer cet objectif ?')){db.goals=db.goals.filter(x=>x.id!==id);save();render()}return}if(a==='delete-session'){if(confirm('Supprimer cette séance et les erreurs qui y sont liées ?')){db.sessions=db.sessions.filter(x=>x.id!==id);db.mistakes=db.mistakes.filter(x=>x.sessionId!==id);save();render();toast('Séance supprimée')}return}if(a==='check-mistake'){const m=db.mistakes.find(x=>x.id===id);if(m){m.successDates=m.successDates||[];if(!m.successDates.includes(today)){m.successDates.push(today);save();render();toast('Récitation réussie aujourd’hui ✓')}}return}if(a==='delete-mistake'){if(confirm('Supprimer cette erreur du carnet ?')){db.mistakes=db.mistakes.filter(x=>x.id!==id);save();render()}return}if(a==='toggle-mistake'||a==='resolve-mistake'){let m=db.mistakes.find(x=>x.id===id);if(m){m.resolved=!m.resolved;m.resolvedAt=m.resolved?today:null;save();render();toast(m.resolved?'Erreur marquée comme corrigée':'Erreur remise à revoir')}return}if(a==='clear-all'){if(confirm('Effacer TOUT ton carnet sur cet appareil ? Cette action est irréversible sans une sauvegarde.')){if(confirm('Dernière confirmation : tout supprimer ?')){db={sessions:[],goals:[],mistakes:[],statuses:{},statusHistory:[],currentSurah:null,vocab:[],guided:null,dinSeeded:true,onboarded:true,lastBackupAt:null};journalDate=today;save();closeModal();nav('home');toast('Carnet vidé')}}return}});
